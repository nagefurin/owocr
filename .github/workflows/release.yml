name: "Portable Windows build"

"on":
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to use if creating a draft GitHub release."
        type: string
        required: true
        default: "v1.26.8-portable.1"
      create-draft-release:
        description: "Attach the Windows ZIP to a draft GitHub release. Leave off for a build-only test."
        type: boolean
        required: true
        default: false

run-name: "Portable Windows build (${{ inputs.tag }})"

jobs:
  build-binary-win-x64:
    name: "Build portable Windows x64 ZIP"
    uses: "./.github/workflows/build-binary-win.yml"
    with:
      name: "windows-portable"
      runner: windows-2025

  publish-github:
    name: "Draft GitHub release"
    if: ${{ inputs.create-draft-release }}
    runs-on: ubuntu-slim
    needs:
      - build-binary-win-x64

    permissions:
      contents: write

    steps:
      -
        name: "Download Windows build artifact"
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          path: dist/
      -
        name: "Draft GitHub release"
        uses: ncipollo/release-action@b7eabc95ff50cbeeedec83973935c8f306dfcd0b
        with:
          tag: "${{ inputs.tag }}"
          draft: true
          allowUpdates: true
          updateOnlyUnreleased: true
          artifacts: >-
            dist/*/owocr-*
          replacesArtifacts: true
