name: "Portable Windows build"

"on":
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to use if creating a draft GitHub release."
        type: string
        required: true
        default: "v1.26.8-portable.1"
      create-draft-release:
        description: "Attach the Windows ZIP to a draft GitHub release. Leave off for a build-only test."
        type: boolean
        required: true
        default: false

run-name: "Portable Windows build (${{ inputs.tag }})"

jobs:
  build-binary-win-x64:
    name: "Build portable Windows x64 ZIP"
    uses: "./.github/workflows/build-binary-win.yml"
    with:
      name: "windows-portable"
      runner: windows-2025

  publish-github:
    name: "Draft GitHub release"
    if: ${{ inputs.create-draft-release }}
    runs-on: windows-2025
    needs:
      - build-binary-win-x64

    permissions:
      contents: write

    steps:
      -
        name: "Download Windows build artifact"
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          path: dist/
      -
        name: "Create single-download ZIP"
        shell: pwsh
        run: |-
          $portableDir = "dist/windows-portable"
          $releaseZip = "dist/owocr-windows-portable.zip"
          $limitBytes = 450000000

          if (!(Test-Path (Join-Path $portableDir "owocr.exe"))) {
            throw "Downloaded artifact is missing owocr.exe in $portableDir"
          }

          Compress-Archive -Path "$portableDir/*" -DestinationPath $releaseZip -CompressionLevel Optimal
          $zipSize = (Get-Item $releaseZip).Length
          Write-Host ("Release ZIP size: {0:N0} bytes" -f $zipSize)
          if ($zipSize -ge $limitBytes) {
            throw "Portable release ZIP must be under 450 MB; actual size is $zipSize bytes."
          }
      -
        name: "Draft GitHub release"
        uses: ncipollo/release-action@b7eabc95ff50cbeeedec83973935c8f306dfcd0b
        with:
          tag: "${{ inputs.tag }}"
          draft: true
          allowUpdates: true
          updateOnlyUnreleased: true
          artifacts: >-
            dist/owocr-*
          replacesArtifacts: true
